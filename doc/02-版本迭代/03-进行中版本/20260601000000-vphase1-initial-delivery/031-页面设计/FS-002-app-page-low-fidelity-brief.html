    function getRoute(row) {
      return routeOverrides[row.key] || row.route
    }

    function getTestUrl(row) {
      return testBaseUrl + getRoute(row)
    }

    function getScreens(row) {
      const configured = currentScreensByKey[row.key]
      if (configured) return configured
      return row.image ? [{ image: row.image, label: '当前页面' }] : []
    }

    function applyCurrentReviewState(row) {
      const screens = getScreens(row)
      return {
        ...row,
        route: getRoute(row),
        side: sideOverrides[row.key] || getSide(row),
        image: screens[0] ? screens[0].image : '',
        imageNote: screens.length ? `2026-08-09 当前版本 · ${screens.length} 个状态` : '当前未提供独立页面',
        status: screens.length ? 'current' : 'missing',
        highFidelityStatus: finalApprovedKeys.has(row.key) ? 'approved' : row.key === 'login' ? 'pending' : '',
        annotation: reviewAnnotations[row.key] || row.annotation || ''
      }
    }

    function getDefaultRows() {
      if (finalExportedRows.length) {
        return JSON.parse(JSON.stringify(finalExportedRows))
      }
      return initialRows.filter((row) => finalDefaultKeys.has(row.key)).map(applyCurrentReviewState)
    }

    function loadRows() {
      try {
        const saved = localStorage.getItem(storageKey)
        if (saved) return JSON.parse(saved)
      } catch (_) {}
      return getDefaultRows()
    }

    function getSide(row) {
      if (row.side) return row.side
      return row.group === '公共页面' ? '公共' : row.group === '企业端' ? '企业' : '学员'
    }

            h('li', { key: 'tone' }, '统一为明亮、克制的橘子海暖橙，象牙白纸纹、珠光白信息卡、深海蓝文字和柔和阴影。避免黑色沉重底色、玫瑰金、金闪、霓虹、Q 版卡通和后台管理台式平铺。'),
            h('li', { key: 'background' }, '低对比、无文字的抽象航线或纸纹可满宽且可位于文字后方，但不得影响阅读；写实人物、设备或训练场景必须收在主内容同一左右边界内，不能满屏铺开或遮挡文案。信息密集的表单、记录、列表页优先不使用写实背景。'),
            h('li', { key: 'navbar' }, '凡代码使用 HomeProfileTabBar 的页面，必须使用公共三项底部导航：首页 / AI 助手 / 我的，中间为品牌 Logo 岛台；只有当前导航页可使用暖橙激活态。'),
            h('li', { key: 'clean' }, '禁止生成系统状态栏、时间、信号、电池、Wi-Fi、水印、虚构功能、虚构业务数据、重叠文字或难以阅读的背景文字。')
          ])
        ]),
        h(Card, { key: 'flow', title: '二、每次生图后的必经操作' }, [
          h('div', { className: 'guide-flow', key: 'steps' }, flow.map((item) => h('div', { className: 'guide-flow__step', key: item[0] }, [
            h('span', { className: 'guide-flow__number', key: 'number' }, item[0]),
            h('span', { className: 'guide-flow__title', key: 'title' }, item[1]),
            h('span', { className: 'guide-flow__copy', key: 'copy' }, item[2])
          ]))),
          h('div', { className: 'guide-callout', key: 'callout' }, '关键规则：无论原页面此前是“已通过”还是“待审核”，只要替换了高保真图片，必须立即把该页面的高保真状态改回“待审核”，由评审人重新确认后才能改为“已通过”。')
        ]),
        h(Card, { key: 'archive', title: '三、归档和回填要求' }, [
          h('ul', { className: 'guide-list', key: 'list' }, [
            h('li', { key: 'file' }, '图片文件放在本 HTML 所在目录，使用连续且可读的文件名，例如 visual-v026-page-name-review.png；不引用临时目录或个人目录。'),
            h('li', { key: 'map' }, '在 highFidelityByKey 中更新对应页面的 number、title、image 和默认 status；图片编号不可重复。'),
            h('li', { key: 'status' }, '导出评审数据前，在表格中确认该页状态为“待审核”，并在批注中记录本次修改点、采用的数据状态和需要评审的重点。'),
            h('li', { key: 'verify' }, '交付前检查图片文件存在、像素正确、页面表格缩略图可打开、点击大图可预览；最后通过“导出评审数据”输出 JSON，与 HTML 和全部图片一并打包。')
          ]),
          h('code', { className: 'guide-code', key: 'code' }, "highFidelityByKey['page-key'] = {\n  number: 'V026',\n  title: '页面名称',\n  image: 'visual-v026-page-name-review.png',\n  status: 'pending'\n}")
        ]),
        h(Card, { key: 'handover', title: '四、交接包内容' }, [
          h('p', { key: 'copy' }, '交接时保持目录结构不变，至少包含：本 HTML、全部 current-app 当前页面截图、全部 visual-v 高保真图、最终导出的 FS-002-app-page-review-data.json，以及本页已写明的规范。接手人可直接打开 HTML 继续批注、替换图片、调整状态并导出下一版 JSON。')
        ])
      ])
    }

    function App() {
      const [rows, setRows] = useState(loadRows)
      const [activeView, setActiveView] = useState('guide')
      const [keyword, setKeyword] = useState('')
      const [group, setGroup] = useState('all')
      const [editing, setEditing] = useState(null)
      const [draft, setDraft] = useState('')
      const [preview, setPreview] = useState(null)
      const [previewIndex, setPreviewIndex] = useState(0)
      const [visualPreview, setVisualPreview] = useState(null)
      const fileInput = useRef(null)

      const saveRows = (nextRows) => {
        setRows(nextRows)
        localStorage.setItem(storageKey, JSON.stringify(nextRows))
      }
      const filteredRows = useMemo(() => rows.filter((row) => {
        const hit = !keyword.trim() || `${row.name} ${getRoute(row)} ${row.plan} ${row.annotation}`.toLowerCase().includes(keyword.trim().toLowerCase())
        return hit && (group === 'all' || getSide(row) === group)
      }), [rows, keyword, group])
      const editAnnotation = (row) => { setEditing(row); setDraft(row.annotation || '') }
      const saveAnnotation = () => { saveRows(rows.map((row) => row.key === editing.key ? { ...row, annotation: draft.trim() } : row)); setEditing(null); message.success('批注已保存') }
      const removeRow = (key) => { saveRows(rows.filter((row) => row.key !== key)); message.success('页面条目已删除') }
      const updateSide = (key, value) => saveRows(rows.map((row) => row.key === key ? { ...row, side: value } : row))
      const updateHighFidelityStatus = (key, value) => saveRows(rows.map((row) => row.key === key ? { ...row, highFidelityStatus: value } : row))
      const openPreview = (row) => { setPreview({ name: row.name, screens: getScreens(row) }); setPreviewIndex(0) }
      const exportRows = () => {
        const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), rows }, null, 2)], { type: 'application/json' })
        const link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = 'FS-002-app-page-review-data.json'
        link.click()
        URL.revokeObjectURL(link.href)
      }
      const importRows = (event) => {
        const file = event.target.files && event.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result)
            if (!Array.isArray(data.rows)) throw new Error('invalid')
            saveRows(data.rows)
            message.success('评审数据已导入')
          } catch (_) { message.error('导入失败：请选择导出的评审 JSON 文件') }
        }
        reader.readAsText(file, 'utf-8')
        event.target.value = ''
      }
      const resetRows = () => Modal.confirm({ title: '恢复最终导出清单？', content: '将恢复 2026-08-13 最终导出的默认数据；已填写的批注和删除操作会被清除。', okText: '恢复', cancelText: '取消', onOk: () => saveRows(getDefaultRows()) })

      const columns = [
        { title: '页面名称与测试访问', key: 'name', width: 245, render: (_, row) => h('div', { className: 'page-name' }, [h('span', { className: 'page-name__title', key: 'name' }, row.name), h('a', { className: 'page-name__route', key: 'route', href: getTestUrl(row), target: '_blank', rel: 'noreferrer' }, getTestUrl(row))]) },
        { title: '所属端', key: 'side', width: 92, render: (_, row) => h(Select, { value: getSide(row), style: { width: 72 }, onChange: (value) => updateSide(row.key, value), options: sideOptions.map((value) => ({ value, label: value })) }) },
        { title: '当前页面规划 / 功能说明', dataIndex: 'plan', key: 'plan', width: 360, render: (value) => h('div', { className: 'plan-copy' }, value) },
        { title: '现有低保真图', key: 'image', width: 112, render: (_, row) => {
          const screens = getScreens(row)
          return screens.length ? h('div', null, [h('button', { className: 'screen-thumb', type: 'button', onClick: () => openPreview(row), key: 'image' }, h('img', { src: './' + screens[0].image, alt: row.name })), h('div', { className: 'screen-meta', key: 'note' }, `${screens[0].label}${screens.length > 1 ? ` · 共 ${screens.length} 个状态` : ''}`)]) : h('div', null, [h('div', { className: 'screen-empty', key: 'empty' }, '当前未提供页面'), h('div', { className: 'screen-meta', key: 'note' }, row.imageNote)])
        } },
        { title: '高保真视觉图', key: 'high-fidelity', width: 112, render: (_, row) => {
          const visual = highFidelityByKey[row.key]
          return visual ? h('div', null, [
            h('button', { className: 'screen-thumb', type: 'button', onClick: () => setVisualPreview(visual), key: 'image' }, h('img', { src: './' + visual.image, alt: `${visual.title}高保真视觉图` })),
            h('div', { className: 'screen-meta', key: 'note' }, `${visual.number} 已生成`)
          ]) : h('div', null, [h('div', { className: 'screen-empty', key: 'empty' }, '待生成'), h('div', { className: 'screen-meta', key: 'note' }, '按低保真交互逐页补齐')])
        } },
        { title: '高保真状态', key: 'high-fidelity-status', width: 120, render: (_, row) => {
          const visual = highFidelityByKey[row.key]
          return visual ? h(Select, { value: row.highFidelityStatus || visual.status || 'pending', style: { width: 96 }, onChange: (value) => updateHighFidelityStatus(row.key, value), options: Object.entries(highFidelityStatusMeta).map(([value, meta]) => ({ value, label: meta.label })) }) : h('span', { className: 'screen-meta' }, '未生成')
        } },
        { title: '批注', key: 'annotation', width: 245, render: (_, row) => h('div', { className: 'annotation-cell' }, [row.annotation ? h('div', { className: 'annotation-copy', key: 'copy' }, row.annotation) : h('div', { className: 'annotation-empty', key: 'empty' }, '暂无批注'), h(Button, { size: 'small', key: 'edit', onClick: () => editAnnotation(row) }, row.annotation ? '编辑批注' : '添加批注')]) },
        { title: '操作', key: 'actions', fixed: 'right', width: 92, render: (_, row) => h(Popconfirm, { title: '删除该页面条目？', description: '删除后可通过恢复初始清单撤销。', okText: '删除', cancelText: '取消', onConfirm: () => removeRow(row.key) }, h(Button, { danger: true, size: 'small' }, '删除')) }
      ]

      return h(ConfigProvider, { theme: { token: { colorPrimary: '#1677ff', borderRadius: 6, fontFamily: 'Microsoft YaHei, PingFang SC, Arial, sans-serif' } } },
        h('main', { className: 'app-shell' }, [
          h('header', { className: 'page-heading', key: 'header' }, [h('h1', { key: 'title' }, '小技客户端页面低保真评审清单'), h('p', { key: 'subtitle' }, '页面名称、测试访问链接和当前规划优先展示；高保真视觉稿单独进入审核。')]),
          h(Tabs, { className: 'design-tabs', key: 'tabs', activeKey: activeView, onChange: setActiveView, items: [
            { key: 'guide', label: '生图规范与交接' },
            { key: 'low-fidelity', label: '低保真设计' },
            { key: 'visual', label: '视觉设计 V1' }
          ] }),
          activeView === 'guide' ? h(ImageGenerationGuide, { key: 'guide' }) : null,
          h('section', { key: 'low-fidelity', style: { display: activeView === 'low-fidelity' ? 'block' : 'none' } }, [
          h(Alert, { key: 'alert', type: 'info', showIcon: true, message: '评审数据可编辑', description: '批注、高保真状态和删除操作会保存在当前浏览器。请通过“导出评审数据”生成 JSON 文件提供给开发，后续可据此统一修改页面和说明。', style: { marginBottom: 16 } }),
          h(Card, { className: 'table-card', key: 'card', bodyStyle: { padding: 16 } }, [
            h('div', { className: 'toolbar', key: 'toolbar' }, [
              h('div', { className: 'toolbar-left', key: 'left' }, [
                h(Input, { key: 'search', value: keyword, onChange: (event) => setKeyword(event.target.value), placeholder: '搜索页面、路由、规划或批注', allowClear: true, style: { width: 270 } }),
                h(Select, { key: 'group', value: group, onChange: setGroup, style: { width: 110 }, options: [{ value: 'all', label: '全部端' }].concat(sideOptions.map((value) => ({ value, label: value }))) })
              ]),
              h('div', { className: 'toolbar-right', key: 'right' }, [
                h('span', { className: 'summary', key: 'summary' }, `共 ${rows.length} 页，点击测试访问链接可打开对应页面`),
                h(Button, { key: 'export', onClick: exportRows }, '导出评审数据'),
                h(Button, { key: 'import', onClick: () => fileInput.current.click() }, '导入评审数据'),
                h(Button, { key: 'reset', onClick: resetRows }, '恢复初始清单'),
                h('input', { key: 'file', className: 'file-input', ref: fileInput, type: 'file', accept: 'application/json', onChange: importRows })
              ])
            ]),
            h(Table, { key: 'table', columns, dataSource: filteredRows, rowKey: 'key', scroll: { x: 1500 }, pagination: { pageSize: 12, showSizeChanger: true, showTotal: (total) => `共 ${total} 条` } })
          ]),
          h(Modal, { key: 'annotation', title: editing ? `批注：${editing.name}` : '批注', open: Boolean(editing), okText: '保存批注', cancelText: '取消', onOk: saveAnnotation, onCancel: () => setEditing(null) }, h(TextArea, { value: draft, rows: 7, maxLength: 1000, showCount: true, placeholder: '记录页面、交互、文案、截图或设计修改意见', onChange: (event) => setDraft(event.target.value) })),
          h(Modal, { key: 'preview', className: 'image-modal', title: preview ? `${preview.name} - 当前移动端截图` : '图片预览', open: Boolean(preview), footer: null, onCancel: () => setPreview(null), width: 900 }, preview && h('div', null, [
            h('img', { key: 'image', src: './' + preview.screens[previewIndex].image, alt: `${preview.name}-${preview.screens[previewIndex].label}` }),
            preview.screens.length > 1 && h(Space, { key: 'screens', wrap: true, style: { marginTop: 14 } }, preview.screens.map((screen, index) => h(Button, { key: screen.image, type: index === previewIndex ? 'primary' : 'default', onClick: () => setPreviewIndex(index) }, screen.label)))
          ]))
          ]),
          h(Modal, {
            key: 'visual-preview',
            className: 'image-modal',
            title: visualPreview ? `${visualPreview.number} ${visualPreview.title} - 高保真视觉稿` : '高保真视觉稿预览',
            open: Boolean(visualPreview),
            footer: null,
            onCancel: () => setVisualPreview(null),
            width: 900
          }, visualPreview && h('img', {
            src: './' + visualPreview.image,
            alt: `${visualPreview.number} ${visualPreview.title}高保真视觉稿`
          })),
          activeView === 'visual' ? h(VisualDesign, { key: 'visual', onPreview: setVisualPreview }) : null
        ])
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(h(App))
  </script>
</body>
</html>
